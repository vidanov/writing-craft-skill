<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Writing Craft Skill: teach AI agents to write well, not just avoid sounding like AI">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fc"/>
      <stop offset="100%" stop-color="#eef1f8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" fill="url(#bg)" rx="0"/>

  <!-- Left side: before/after comparison -->
  <rect x="40" y="40" width="340" height="220" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- "Before" block (AI output) -->
  <text x="60" y="68" font-family="SF Mono, Menlo, monospace" font-size="10" fill="#94a3b8" font-weight="600" letter-spacing="0.05em">BEFORE</text>
  <rect x="60" y="78" width="300" height="14" rx="3" fill="#fecaca" opacity="0.6"/>
  <text x="64" y="89" font-family="Georgia, serif" font-size="10" fill="#991b1b" text-decoration="line-through">In today's rapidly evolving cloud landscape,</text>
  <rect x="60" y="98" width="280" height="14" rx="3" fill="#fecaca" opacity="0.6"/>
  <text x="64" y="109" font-family="Georgia, serif" font-size="10" fill="#991b1b" text-decoration="line-through">organizations are increasingly leveraging</text>
  <rect x="60" y="118" width="260" height="14" rx="3" fill="#fecaca" opacity="0.6"/>
  <text x="64" y="129" font-family="Georgia, serif" font-size="10" fill="#991b1b" text-decoration="line-through">cutting-edge solutions to enhance their</text>

  <!-- Divider -->
  <line x1="60" y1="148" x2="340" y2="148" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- "After" block (crafted output) -->
  <text x="60" y="170" font-family="SF Mono, Menlo, monospace" font-size="10" fill="#059669" font-weight="600" letter-spacing="0.05em">AFTER</text>
  <text x="64" y="190" font-family="Georgia, serif" font-size="11" fill="#1e293b">Last Tuesday our deploy pipeline broke.</text>
  <text x="64" y="208" font-family="Georgia, serif" font-size="11" fill="#1e293b">Not the code. The integration. The upstream</text>
  <text x="64" y="226" font-family="Georgia, serif" font-size="11" fill="#1e293b">team changed their payload schema without</text>
  <text x="64" y="244" font-family="Georgia, serif" font-size="11" fill="#1e293b">telling anyone. 40 minutes of downtime.</text>

  <!-- Right side: skill name and tagline -->
  <text x="460" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="36" fill="#1e293b" font-weight="800">writing-craft</text>

  <text x="460" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#64748b">Teach AI agents to write well,</text>
  <text x="460" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#64748b">not just avoid sounding like AI.</text>

  <!-- Principle pills -->
  <rect x="460" y="170" width="88" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="504" y="187" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#2563eb" font-weight="600">Ogilvy</text>

  <rect x="558" y="170" width="95" height="26" rx="13" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="605" y="187" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#16a34a" font-weight="600">Sugarman</text>

  <rect x="663" y="170" width="78" height="26" rx="13" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="702" y="187" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7c3aed" font-weight="600">Zinsser</text>

  <rect x="751" y="170" width="88" height="26" rx="13" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="795" y="187" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ea580c" font-weight="600">Hemingway</text>

  <rect x="460" y="206" width="82" height="26" rx="13" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="501" y="223" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626" font-weight="600">Deutsch</text>

  <rect x="552" y="206" width="130" height="26" rx="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="617" y="223" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#475569" font-weight="600">24 AI anti-patterns</text>

  <!-- Bottom tagline -->
  <text x="460" y="265" font-family="SF Mono, Menlo, monospace" font-size="11" fill="#94a3b8">$ cp SKILL.md .kiro/skills/writing-craft/</text>

  <!-- Animated cursor blink on the "After" text -->
  <rect x="318" y="234" width="2" height="14" fill="#2563eb">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
