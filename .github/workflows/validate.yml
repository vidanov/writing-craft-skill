name: Validate Skill
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate marketplace.json
        run: |
          echo "Checking marketplace.json syntax..."
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"
          echo "✅ marketplace.json is valid JSON"
      - name: Validate plugin.json
        run: |
          echo "Checking plugin.json syntax..."
          python3 -c "import json; json.load(open('plugins/writing-craft/.claude-plugin/plugin.json'))"
          echo "✅ plugin.json is valid JSON"
      - name: Validate skills.sh.json
        run: |
          echo "Checking skills.sh.json syntax..."
          python3 -c "import json; json.load(open('skills.sh.json'))"
          echo "✅ skills.sh.json is valid JSON"
      - name: Check SKILL.md frontmatter
        run: |
          echo "Checking SKILL.md files have frontmatter..."
          for f in kiro/SKILL.md claude/SKILL.md plugins/writing-craft/skills/writing-craft/SKILL.md; do
            if head -1 "$f" | grep -q "^---"; then
              echo "✅ $f has frontmatter"
            else
              echo "❌ $f missing frontmatter"
              exit 1
            fi
          done
      - name: Check no banned phrases in README
        run: |
          echo "Checking README for banned vocabulary..."
          BANNED="delve|tapestry|leveraging|holistic|synergy|game-changer|paradigm shift"
          # Strip blockquotes, code blocks, HTML comments, and table rows with vrm-ignore before checking
          grep -v '^\s*>' README.md | grep -v '```' | grep -v 'vrm-ignore' | grep -v '^\s*|' | grep -iE "$BANNED" && echo "❌ README contains banned vocabulary" && exit 1 || echo "✅ README clean of banned vocabulary"
